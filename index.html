<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <!-- header -->
    <button id="theme-switch">
      <i class="bi bi-lightbulb"></i><i class="bi bi-lightbulb-fill"></i>
    </button>
    <div class="container">
      <h1><i class="bi bi-kanban"></i> Kanban</h1>
      <p class="page-subtitle">
        Kanban board is your personal task manager. Add tasks, set priorities
        and deadlines, and move them across the columns as you progress.
      </p>
    </div>

    <!-- container for columns Kanban board -->
    <div class="container columns">
      <!-- 1. backlog column -->
      <div class="column">
        <div class="column-title">
          <h3 data-tasks="0">Backlog</h3>
          <button data-add><i class="bi bi-plus"></i></button>
          <div class="filter-wrapper">
            <button data-filter><i class="bi bi-filter"></i></button>

            <div class="filter-dropdown">
              <label
                ><input
                  type="radio"
                  name="sort-backlog"
                  class="sort-option"
                  value="none"
                  checked
                />No sorting</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-backlog"
                  class="sort-option"
                  value="priority-asc"
                />Priority (low to high)</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-backlog"
                  class="sort-option"
                  value="priority-desc"
                />Priority (high to low)</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-backlog"
                  class="sort-option"
                  value="deadline-asc"
                />Deadline (soonest first)</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-backlog"
                  class="sort-option"
                  value="deadline-desc"
                />Deadline (latest first)</label
              >
            </div>
          </div>
        </div>
        <div class="tasks"></div>
        <button data-add><i class="bi bi-plus"></i>New task</button>
      </div>

      <!-- 2. to do column -->
      <div class="column">
        <div class="column-title">
          <h3 data-tasks="0">To Do</h3>
          <button data-add><i class="bi bi-plus"></i></button>
          <div class="filter-wrapper">
            <button data-filter><i class="bi bi-filter"></i></button>

            <div class="filter-dropdown">
              <label
                ><input
                  type="radio"
                  name="sort-todo"
                  class="sort-option"
                  value="none"
                  checked
                />No sorting</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-todo"
                  class="sort-option"
                  value="priority-asc"
                />Priority (low to high)</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-todo"
                  class="sort-option"
                  value="priority-desc"
                />Priority (high to low)</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-todo"
                  class="sort-option"
                  value="deadline-asc"
                />Deadline (soonest first)</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-todo"
                  class="sort-option"
                  value="deadline-desc"
                />Deadline (latest first)</label
              >
            </div>
          </div>
        </div>
        <div class="tasks"></div>
        <button data-add><i class="bi bi-plus"></i>New task</button>
      </div>
      <!-- 3. in progress column -->
      <div class="column">
        <div class="column-title">
          <h3 data-tasks="0">In Progress</h3>
          <button data-add><i class="bi bi-plus"></i></button>
          <div class="filter-wrapper">
            <button data-filter><i class="bi bi-filter"></i></button>

            <div class="filter-dropdown">
              <label
                ><input
                  type="radio"
                  name="sort-inprogress"
                  class="sort-option"
                  value="none"
                  checked
                />No sorting</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-inprogress"
                  class="sort-option"
                  value="priority-asc"
                />Priority (low to high)</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-inprogress"
                  class="sort-option"
                  value="priority-desc"
                />Priority (high to low)</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-inprogress"
                  class="sort-option"
                  value="deadline-asc"
                />Deadline (soonest first)</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-inprogress"
                  class="sort-option"
                  value="deadline-desc"
                />Deadline (latest first)</label
              >
            </div>
          </div>
        </div>
        <div class="tasks"></div>
        <button data-add><i class="bi bi-plus"></i>New task</button>
      </div>
      <!-- 4. done column -->
      <div class="column">
        <div class="column-title">
          <h3 data-tasks="0">Done</h3>
          <button data-add><i class="bi bi-plus"></i></button>
          <div class="filter-wrapper">
            <button data-filter><i class="bi bi-filter"></i></button>

            <div class="filter-dropdown">
              <label
                ><input
                  type="radio"
                  name="sort-done"
                  class="sort-option"
                  value="none"
                  checked
                />No sorting</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-done"
                  class="sort-option"
                  value="priority-asc"
                />Priority (low to high)</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-done"
                  class="sort-option"
                  value="priority-desc"
                />Priority (high to low)</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-done"
                  class="sort-option"
                  value="deadline-asc"
                />Deadline (soonest first)</label
              >
              <label
                ><input
                  type="radio"
                  name="sort-done"
                  class="sort-option"
                  value="deadline-desc"
                />Deadline (latest first)</label
              >
            </div>
          </div>
        </div>
        <div class="tasks"></div>
        <button data-add><i class="bi bi-plus"></i>New task</button>
      </div>
    </div>

    <!-- modal for confirmation of delete -->
    <dialog class="confirm-modal">
      <form method="dialog">
        <h3>Delete Task?</h3>
        <p>* Make sure you choose the correct task *</p>
        <div class="preview"></div>
        <menu>
          <button type="button" id="delete-cancel">Cancel</button>
          <button type="submit" id="delete-confirm">Yes, delete it</button>
        </menu>
      </form>
    </dialog>

    <!-- modal for adding/editing task -->
    <dialog class="task-modal">
      <form method="dialog">
        <h3>Add Task</h3>
        <label for="task-title">Task Title:</label>
        <input
          type="text"
          id="task-title"
          name="task-title"
          aria-label="Task title"
          placeholder="Task Title"
          required
        />

        <label for="task-description">Task Description:</label>
        <textarea
          id="task-description"
          name="task-description"
          rows="4"
          aria-label="Task description"
          placeholder="Task Description"
        ></textarea>

        <select
          id="task-priority"
          name="task-priority"
          aria-label="Task priority"
        >
          <option value="Undefined">Undefined</option>
          <option value="Low">Low Priority</option>
          <option value="Medium">Medium Priority</option>
          <option value="High">High Priority</option>
        </select>

        <input
          type="date"
          id="task-due-date"
          name="task-due-date"
          aria-label="Due date"
        />

        <menu>
          <button type="button" id="task-cancel">Cancel</button>
          <button type="submit" id="task-confirm">Save</button>
        </menu>
      </form>
    </dialog>
  </body>
</html>
